log_format dashboard_safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent';

# Match the original URI because SPA fallback internally rewrites to index.html.
map $request_uri $dashboard_frame_ancestors {
  default "'none'";
  ~^/login/(watcher|multiwatcher)/ "*";
}
map $dashboard_frame_ancestors $dashboard_frame_options {
  default "DENY";
  "*" "";
}

# Include the security headers in every response, including location blocks with caching headers.
map $uri $dashboard_cache_control {
  default "no-store";
  ~*\.(?:css|js|mjs|wasm|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ "public, max-age=3600";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log dashboard_safe;
  error_log /var/log/nginx/error.log crit;

  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "$dashboard_frame_options" always;
  add_header Cache-Control "$dashboard_cache_control" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.dmnd.work https://production-user-dashboard-server.dmnd.work https://staging-user-dashboard-server.dmnd.work https://testnet3-user-dashboard-server.dmnd.work https://dmnd.ghost.io; object-src 'none'; base-uri 'self'; frame-ancestors $dashboard_frame_ancestors; form-action 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|wasm|json|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    try_files $uri =404;
  }
}
